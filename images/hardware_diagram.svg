<rect width="1240" height="900" fill="#F8FAFC"/>
<text x="60" y="50" font-size="26" font-weight="800" fill="#0F172A">맘캠(MomCam) 하드웨어 부품 관계도</text>
<text x="60" y="78" font-size="14" fill="#475569">메인 SoC를 중심으로 각 부품이 어떤 통신 방식으로 연결되는지, 상자 안에는 동작 전압과 대표 전류·전력을 표시했다.</text>

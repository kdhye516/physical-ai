<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" role="img" aria-label="맘캠 SBC 컨테이너 구조도">
<defs>
<marker id="a-int" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<marker id="a-shm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="a-ext" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
<marker id="a-safe" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
</defs>
<rect width="1240" height="860" fill="#F7F8F6"/>
<text x="40" y="48" font-size="26" font-weight="800" fill="#1E2422">맘캠 SBC 컨테이너 구조 (Radxa ROCK 3C · RK3566)</text>
<text x="40" y="76" font-size="15" fill="#5E6764">영상·소리를 다루는 컨테이너는 인터넷이 막힌 내부 네트워크에만 연결된다. 밖으로 나가는 것은 알림·영상 보기 컨테이너뿐이다.</text>

<!-- SBC outer -->
<rect x="30" y="100" width="900" height="600" rx="18" fill="#FFFFFF" stroke="#C9CFC9" stroke-width="2"/>
<text x="52" y="130" font-size="16" font-weight="700" fill="#1E2422">SBC · Radxa OS(데비안 계열) + Docker</text>

<!-- internal network zone -->
<rect x="50" y="145" width="600" height="400" rx="14" fill="#EEF4FF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="636" y="537" font-size="13.5" font-weight="700" fill="#1D4ED8" text-anchor="end">내부 전용 네트워크 momcam-int · 인터넷 차단</text>

<!-- broker -->
<rect x="250" y="190" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="350" y="218" font-size="16" font-weight="700" fill="#1E2422" text-anchor="middle">broker</text>
<text x="350" y="240" font-size="12.5" fill="#5E6764" text-anchor="middle">내부 MQTT (mosquitto)</text>

<!-- camera -->
<rect x="70" y="300" width="170" height="78" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="155" y="328" font-size="16" font-weight="700" fill="#1E2422" text-anchor="middle">camera</text>
<text x="155" y="348" font-size="12" fill="#5E6764" text-anchor="middle">IR 영상 캡처 · 사생활 마스킹</text>
<text x="155" y="366" font-size="12" fill="#5E6764" text-anchor="middle">/dev/video* · ISP</text>

<!-- vision -->
<rect x="265" y="300" width="170" height="78" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="350" y="328" font-size="16" font-weight="700" fill="#1E2422" text-anchor="middle">vision</text>
<text x="350" y="348" font-size="12" fill="#5E6764" text-anchor="middle">YOLO26n-pose · 자세 판정</text>
<text x="350" y="366" font-size="12" fill="#5E6764" text-anchor="middle">RKNN Runtime · NPU</text>

<!-- audio -->
<rect x="460" y="300" width="170" height="78" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
<text x="545" y="328" font-size="16" font-weight="700" fill="#1E2422" text-anchor="middle">audio</text>
<text x="545" y="348" font-size="12" fill="#5E6764" text-anchor="middle">울음 감지 CNN</text>
<text x="545" y="366" font-size="12" fill="#5E6764" text-anchor="middle">/dev/snd (I2S 마이크)</text>

<!-- guardian -->
<rect x="200" y="440" width="300" height="84" rx="12" fill="#FFF1F1" stroke="#DC2626" stroke-width="2.4"/>
<text x="350" y="470" font-size="17" font-weight="800" fill="#991B1B" text-anchor="middle">guardian (경보 판단)</text>
<text x="350" y="492" font-size="12.5" fill="#7F1D1D" text-anchor="middle">5초 연속 엎드림 판정 · 하트비트 · 항상 재시작</text>
<text x="350" y="511" font-size="12.5" fill="#7F1D1D" text-anchor="middle">/dev/ttyS* (MCU UART)</text>

<!-- shm -->
<rect x="70" y="200" width="150" height="46" rx="8" fill="#F5F0FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="145" y="221" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">공유 메모리</text>
<text x="145" y="238" font-size="11.5" fill="#5B21B6" text-anchor="middle">/dev/shm 영상 버퍼</text>

<!-- external zone -->
<rect x="670" y="145" width="240" height="400" rx="14" fill="#FFF6EE" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="688" y="170" font-size="14" font-weight="700" fill="#C2410C">외부 연결 가능 (TLS만)</text>

<rect x="690" y="200" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.6"/>
<text x="790" y="228" font-size="16" font-weight="700" fill="#1E2422" text-anchor="middle">notifier</text>
<text x="790" y="249" font-size="12" fill="#5E6764" text-anchor="middle">앱 알림 (MQTT/HTTPS · TLS)</text>
<text x="790" y="267" font-size="12" fill="#5E6764" text-anchor="middle">보안 칩 /dev/i2c-*</text>

<rect x="690" y="320" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.6"/>
<text x="790" y="348" font-size="16" font-weight="700" fill="#1E2422" text-anchor="middle">live</text>
<text x="790" y="369" font-size="12" fill="#5E6764" text-anchor="middle">앱에서 볼 때만 켜지는 영상</text>
<text x="790" y="387" font-size="12" fill="#5E6764" text-anchor="middle">H.264 하드웨어 인코더</text>

<!-- host layer -->
<rect x="50" y="565" width="860" height="115" rx="12" fill="#F1F3F0" stroke="#8A948F" stroke-width="1.4"/>
<text x="70" y="592" font-size="15" font-weight="700" fill="#1E2422">호스트 (컨테이너 밖)</text>
<text x="70" y="618" font-size="13" fill="#3F4744">리눅스 커널 · NPU/카메라/코덱 드라이버 · Docker 엔진 · 하드웨어 워치독 · OTA 업데이트(A/B) · 로그 크기 제한</text>
<text x="70" y="642" font-size="13" fill="#3F4744">장치 파일은 필요한 컨테이너에만 하나씩 전달 (privileged 금지, root 아님, 읽기 전용 파일시스템)</text>
<text x="70" y="666" font-size="13" fill="#3F4744">CPU 4코어 나눠 쓰기: 0번 호스트·guardian·broker / 1번 camera / 2번 audio·notifier / 3번 live</text>

<!-- MCU -->
<rect x="975" y="420" width="235" height="150" rx="14" fill="#FFF1F1" stroke="#DC2626" stroke-width="2.4"/>
<text x="1092" y="452" font-size="17" font-weight="800" fill="#991B1B" text-anchor="middle">MCU · STM32G031</text>
<text x="1092" y="478" font-size="12.5" fill="#7F1D1D" text-anchor="middle">경보 부저 · 상태 LED · 버튼</text>
<text x="1092" y="498" font-size="12.5" fill="#7F1D1D" text-anchor="middle">하트비트 10초 끊기면</text>
<text x="1092" y="518" font-size="12.5" fill="#7F1D1D" text-anchor="middle">"감시 중단" 경보 → SBC 리셋</text>
<text x="1092" y="546" font-size="12" fill="#7F1D1D" text-anchor="middle">리눅스·Wi-Fi와 무관하게 동작</text>

<!-- cloud -->
<rect x="985" y="200" width="215" height="84" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.6"/>
<text x="1092" y="232" font-size="16" font-weight="700" fill="#1E2422" text-anchor="middle">알림 서버 · 보호자 앱</text>
<text x="1092" y="256" font-size="12.5" fill="#5E6764" text-anchor="middle">이벤트·썸네일만 전송</text>
<text x="1092" y="274" font-size="12.5" fill="#5E6764" text-anchor="middle">(상시 영상 전송 없음)</text>

<!-- arrows: shm -->
<path d="M145 300 L145 250" stroke="#7C3AED" stroke-width="2.4" fill="none" marker-end="url(#a-shm)"/>
<path d="M222 236 C 300 270, 320 280, 330 298" stroke="#7C3AED" stroke-width="2.4" fill="none" marker-end="url(#a-shm)"/>
<path d="M150 199 C 165 120, 650 112, 668 200 C 676 260, 672 330, 688 352" stroke="#7C3AED" stroke-width="2.2" fill="none" stroke-dasharray="5 4" marker-end="url(#a-shm)"/>
<text x="420" y="118" font-size="12" fill="#5B21B6">영상 프레임 (live가 켜졌을 때만)</text>

<!-- arrows: mqtt -->
<path d="M350 300 L350 258" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#a-int)"/>
<path d="M545 300 C 545 270, 470 250, 452 236" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#a-int)"/>
<path d="M260 254 C 200 290, 160 400, 230 438" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#a-int)"/>
<path d="M452 210 C 560 200, 640 220, 688 236" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#a-int)"/>
<text x="470" y="198" font-size="12" fill="#1D4ED8">이벤트 메시지 (MQTT)</text>
<text x="120" y="420" font-size="12" fill="#1D4ED8">자세·울음 결과</text>

<!-- arrows: external -->
<path d="M890 242 L983 242" stroke="#EA580C" stroke-width="2.4" fill="none" marker-end="url(#a-ext)" marker-start="url(#a-ext)"/>
<path d="M890 362 C 940 362, 950 300, 1010 286" stroke="#EA580C" stroke-width="2.2" fill="none" marker-end="url(#a-ext)"/>
<text x="900" y="232" font-size="12" fill="#C2410C">TLS</text>

<!-- safety -->
<path d="M500 490 C 700 490, 820 495, 972 495" stroke="#DC2626" stroke-width="4" fill="none" marker-end="url(#a-safe)" marker-start="url(#a-safe)"/>
<text x="690" y="520" font-size="13" font-weight="700" fill="#B91C1C">UART: 하트비트 1초 · 경보 명령</text>
<path d="M1092 572 C 1092 640, 1000 650, 912 640" stroke="#DC2626" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#a-safe)"/>
<text x="950" y="668" font-size="12.5" fill="#B91C1C">SBC 리셋 선 (GPIO)</text>

<!-- legend -->
<g transform="translate(40,730)">
<rect width="1160" height="100" rx="12" fill="#FFFFFF" stroke="#D5D9D4"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#1E2422">선 읽는 법</text>
<line x1="20" y1="58" x2="70" y2="58" stroke="#7C3AED" stroke-width="3"/><text x="80" y="63" font-size="13" fill="#3F4744">공유 메모리 (영상 프레임, 복사 없이 전달)</text>
<line x1="380" y1="58" x2="430" y2="58" stroke="#2563EB" stroke-width="3"/><text x="440" y="63" font-size="13" fill="#3F4744">내부 MQTT (작은 이벤트 메시지)</text>
<line x1="700" y1="58" x2="750" y2="58" stroke="#EA580C" stroke-width="3"/><text x="760" y="63" font-size="13" fill="#3F4744">외부 통신 (TLS 암호화)</text>
<line x1="20" y1="86" x2="70" y2="86" stroke="#DC2626" stroke-width="4"/><text x="80" y="91" font-size="13" fill="#3F4744">안전 경로: guardian ↔ MCU. 인터넷·앱·다른 컨테이너가 멈춰도 이 경로로 경보가 울린다</text>
</g>
</svg>

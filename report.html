<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맘캠 MomCam 보고서 | 나만의 피지컬 AI</title>
  <meta name="description" content="맘캠 제품 요구사항(PRD), 데이터 전처리 설계, YOLO 모델 선정·학습·검증 보고서">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #F5F6F3;
      --ink: #1E2422;
      --muted: #5E6764;
      --line: #D5D9D4;
      --accent: #8FD3F5;
      --surface: #FFFFFF;
      --code: #EEF1EC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.75; word-break: keep-all;
    }
    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

    header { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 10; }
    .nav { display: flex; justify-content: space-between; align-items: center; height: 64px; gap: 16px; }
    .logo { font-weight: 800; font-size: 1.1rem; text-decoration: none; white-space: nowrap; }
    .nav ul { display: flex; gap: 24px; list-style: none; }
    .nav ul a { text-decoration: none; color: var(--muted); font-size: 0.95rem; }
    .nav ul a:hover, .nav ul a[aria-current="page"] { color: var(--ink); }

    .intro { padding: 64px 0 32px; }
    .intro .eyebrow { font-size: .85rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
    .intro h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; margin-top: 8px; text-wrap: balance; }
    .intro p { margin-top: 16px; color: var(--muted); max-width: 40em; font-size: 1.05rem; }

    /* 보고서 카드 */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 32px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px;
      text-align: left; cursor: pointer; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 8px;
    }
    .card:hover { border-color: var(--ink); }
    .card[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 -4px 0 var(--accent); }
    .card .num { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
    .card h2 { font-size: 1.15rem; font-weight: 800; }
    .card p { color: var(--muted); font-size: .93rem; line-height: 1.6; }

    /* 본문 */
    .doc-wrap { padding: 24px 0 80px; }
    .doc-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
      padding: 14px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    .doc-meta a { text-decoration: underline; text-underline-offset: 3px; }
    article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 40px clamp(20px, 5vw, 56px); margin-top: 20px; min-width: 0; scroll-margin-top: 80px; }
    article h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 20px; }
    article h2 { font-size: 1.45rem; font-weight: 800; margin: 48px 0 14px; padding-top: 24px; border-top: 1px solid var(--line); letter-spacing: -0.01em; }
    article h3 { font-size: 1.15rem; font-weight: 700; margin: 32px 0 10px; }
    article h4 { font-size: 1rem; font-weight: 700; margin: 24px 0 8px; }
    article p, article li { font-size: 1rem; }
    article p { margin: 12px 0; }
    article ul, article ol { margin: 12px 0 12px 1.4em; }
    article li { margin: 4px 0; }
    article blockquote { margin: 16px 0; padding: 14px 18px; border-left: 4px solid var(--accent); background: var(--bg); border-radius: 8px; color: var(--ink); }
    article blockquote p { margin: 0; }
    article hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
    article code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .88em; background: var(--code); padding: 2px 6px; border-radius: 5px; }
    article pre { background: #1E2422; color: #E9ECE8; padding: 18px 20px; border-radius: 10px; overflow-x: auto; margin: 16px 0; line-height: 1.55; }
    article pre code { background: none; padding: 0; color: inherit; font-size: .85rem; }
    .table-scroll { overflow-x: auto; margin: 16px 0; }
    article table { border-collapse: collapse; width: 100%; font-size: .92rem; min-width: 560px; }
    article th, article td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; }
    article th { background: var(--bg); font-weight: 700; white-space: nowrap; }
    article td[align="right"], article th[align="right"] { text-align: right; font-variant-numeric: tabular-nums; }

    /* 전처리 결과 이미지 */
    .figure-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
    .figure-strip figure { background: var(--bg); border-radius: 10px; padding: 8px; }
    .figure-strip img { width: 100%; display: block; border-radius: 6px; background: #000; }
    .figure-strip figcaption { font-size: .8rem; color: var(--muted); margin-top: 6px; text-align: center; }

    .status { padding: 40px 0; color: var(--muted); text-align: center; }

    footer { border-top: 1px solid var(--line); padding: 40px 0 56px; color: var(--muted); font-size: 0.95rem; }
    footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

    @media (max-width: 760px) {
      .nav ul { gap: 14px; }
      .nav ul li.hide-sm { display: none; }
      .cards { grid-template-columns: 1fr; }
      .figure-strip { grid-template-columns: repeat(2, 1fr); }
      .intro { padding: 40px 0 16px; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="wrap nav">
      <a class="logo" href="index.html">맘캠 MomCam</a>
      <ul>
        <li class="hide-sm"><a href="index.html">제품 소개</a></li>
        <li><a href="report.html" aria-current="page">보고서</a></li>
        <li><a href="demo.html">데모</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="wrap intro">
      <div class="eyebrow">PROJECT REPORT</div>
      <h1>맘캠 개발 보고서</h1>
      <p>제품 기획(PRD)부터 데이터 전처리 설계, YOLO 기반 모델 선정·학습·검증 계획까지 정리했습니다. 아래에서 보고서를 고르면 전체 내용을 볼 수 있습니다.</p>

      <div class="cards" role="tablist" aria-label="보고서 선택">
        <button class="card" role="tab" id="tab-prd" data-doc="prd" aria-selected="true" aria-controls="doc">
          <span class="num">REPORT 01</span>
          <h2>제품 요구사항 (PRD)</h2>
          <p>해결하려는 문제, 사용자 시나리오, 성공 지표, 기술 스택, 개발 범위, ROI 분석</p>
        </button>
        <button class="card" role="tab" id="tab-pre" data-doc="pre" aria-selected="false" aria-controls="doc">
          <span class="num">REPORT 02</span>
          <h2>데이터 전처리 설계</h2>
          <p>영상 11단계·오디오 8단계 전처리 기법, 적용 이유, 순서를 정한 근거</p>
        </button>
        <button class="card" role="tab" id="tab-model" data-doc="model" aria-selected="false" aria-controls="doc">
          <span class="num">REPORT 03</span>
          <h2>YOLO 모델 선정·학습·검증</h2>
          <p>YOLO26n-pose를 고른 이유, 학습 데이터·방법, 3단계 검증 계획</p>
        </button>
      </div>
    </section>

    <section class="wrap doc-wrap">
      <div class="doc-meta">
        <span id="doc-source">원본 파일: -</span>
        <a id="doc-github" href="https://github.com/kdhye516/physical-ai" target="_blank" rel="noopener">GitHub에서 보기</a>
      </div>
      <article id="doc" role="tabpanel" aria-live="polite">
        <p class="status">보고서를 불러오는 중입니다…</p>
      </article>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>만든 사람: 다혜</span>
      <span>나만의 피지컬 AI 제품 기획 과제</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    // 보고서 원본(마크다운)을 GitHub 저장소에서 불러와 그대로 보여 준다.
    // 저장소의 .md 파일만 고치면 이 페이지에도 자동으로 반영된다.
    var REPO = "kdhye516/physical-ai";
    var RAW = "https://raw.githubusercontent.com/" + REPO + "/main/";
    var DOCS = {
      prd:   { path: "PRD/PRD.md" },
      pre:   { path: "report/preprocessing.md", figures: true },
      model: { path: "report/model_yolo.md" }
    };
    var cache = {};

    function cleanPrd(md) {
      // PRD 파일 앞부분의 빈 템플릿 안내문은 빼고, 실제 맘캠 PRD부터 보여 준다.
      var i = md.indexOf("# PRD: 맘캠");
      return i > 0 ? md.slice(i) : md;
    }

    function figuresHtml() {
      var items = [
        ["code/preview/6_letterbox.png", "⑥ ROI 크롭 + 레터박스"],
        ["code/preview/7_gray.png", "⑦ 그레이스케일"],
        ["code/preview/8_denoise.png", "⑧ 노이즈 제거"],
        ["code/preview/9_clahe.png", "⑨ CLAHE 대비 보정"]
      ];
      var html = '<h2>부록. 전처리 코드 실행 결과</h2>' +
        '<p><code>code/momcam_preprocess.py</code>를 가상 밤 IR 영상으로 실행해 저장한 단계별 결과 이미지입니다. 실제 아기 영상이 아닌 시연용 합성 데이터입니다.</p>' +
        '<div class="figure-strip">';
      items.forEach(function (it) {
        html += '<figure><img src="' + it[0] + '" alt="' + it[1] + ' 결과 이미지" loading="lazy"><figcaption>' + it[1] + '</figcaption></figure>';
      });
      return html + '</div>';
    }

    function render(key, md) {
      var doc = document.getElementById("doc");
      if (key === "prd") md = cleanPrd(md);
      // 한국어 바로 앞뒤에 붙은 **굵게** 표시는 마크다운 규칙상 인식되지 않는 경우가 있어
      // 코드 블록 밖에서만 직접 <strong>으로 바꾼다.
      md = md.split("```").map(function (part, i) {
        return i % 2 ? part : part.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
      }).join("```");
      var html = marked.parse(md);
      if (DOCS[key].figures) html += figuresHtml();
      doc.innerHTML = html;
      // 넓은 표는 가로 스크롤 상자에 넣는다
      doc.querySelectorAll("table").forEach(function (t) {
        var box = document.createElement("div");
        box.className = "table-scroll";
        t.parentNode.insertBefore(box, t);
        box.appendChild(t);
      });
      doc.querySelectorAll("a[href^='http']").forEach(function (a) { a.target = "_blank"; a.rel = "noopener"; });
    }

    function show(key, push) {
      document.querySelectorAll(".card").forEach(function (c) {
        c.setAttribute("aria-selected", c.dataset.doc === key ? "true" : "false");
      });
      var d = DOCS[key];
      document.getElementById("doc-source").textContent = "원본 파일: " + d.path;
      document.getElementById("doc-github").href = "https://github.com/" + REPO + "/blob/main/" + d.path;
      if (push) history.replaceState(null, "", "#" + key);

      var doc = document.getElementById("doc");
      if (cache[key]) { render(key, cache[key]); return; }
      doc.innerHTML = '<p class="status">보고서를 불러오는 중입니다…</p>';
      fetch(RAW + d.path, { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (md) { cache[key] = md; render(key, md); })
        .catch(function () {
          doc.innerHTML = '<p class="status">보고서를 불러오지 못했습니다. ' +
            '<a href="https://github.com/' + REPO + '/blob/main/' + d.path + '" target="_blank" rel="noopener">GitHub에서 원문 보기</a></p>';
        });
    }

    document.querySelectorAll(".card").forEach(function (c) {
      c.addEventListener("click", function () {
        show(c.dataset.doc, true);
        document.getElementById("doc").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    function fromHash() {
      var key = (location.hash || "").replace("#", "");
      show(DOCS[key] ? key : "prd", false);
    }
    window.addEventListener("hashchange", fromHash);
    fromHash();
  </script>
</body>
</html>
